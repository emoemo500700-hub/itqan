<style>
/* إتقان - التربية الخاصة | الأخصائي عماد عبد العزيز */
:root{--bg:#f1faf8;--surface:#fff;--ink:#0f2b2e;--mute:#4f6f72;--line:#d3e7e3;--teal:#0e8f8a;--teal-ink:#fff;--orange:#ff7a2f;--yellow:#ffc933;--pink:#ff6f91;--soft:#e2f4f1;--good:#2f9e44;--help:#f08c00;--shadow:0 5px 0 rgba(14,143,138,.16);--f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;--f-body:"Tajawal",system-ui,sans-serif;--fs:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1b1d;--surface:#132a2d;--ink:#eaf7f5;--mute:#9bbfc0;--line:#254349;--teal:#35c9c0;--teal-ink:#06292a;--orange:#ff9150;--yellow:#ffd75e;--pink:#ff8aa5;--soft:#173337;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html{font-size:var(--fs)}
html.big{--fs:19px}
body{background:var(--bg);color:var(--ink);font:500 1rem/1.7 var(--f-body);direction:rtl;overflow-x:hidden;padding-bottom:30px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}p{margin:0}
.wrap{max-width:980px;margin-inline:auto;padding-inline:14px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:start}
.brand b{font:800 1.45rem/1 var(--f-display);color:var(--teal)}
.brand small{display:block;font-size:.62rem;color:var(--mute);line-height:1.2}
.spacer{flex:1}
.ibtn{min-width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:.95rem;padding:0 8px}
.btn{border:0;border-radius:13px;padding:8px 14px;font-weight:800;font-size:.95rem;background:var(--teal);color:var(--teal-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 60%,#000);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.o{background:var(--orange);color:#2a1100;box-shadow:0 4px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.btn.g{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--mute);font-weight:700;margin-block:12px 4px}
.crumb button{border:0;background:var(--soft);color:var(--teal);border-radius:999px;padding:2px 10px;font-weight:800}
h1.pt{font-size:1.45rem}.sub{color:var(--mute);font-size:.9rem;margin-block:2px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:var(--shadow);transition:transform .15s;min-width:0}
.tile:hover{transform:translateY(-3px)}
.tile .e{font-size:2.3rem;line-height:1.1}.tile b{font:800 1.05rem var(--f-display)}.tile small{color:var(--mute);font-size:.78rem}
.tile.c{border-color:color-mix(in srgb,var(--c) 55%,var(--surface));background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.tile.off{opacity:.62}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:.7rem;font-weight:800;background:var(--soft);color:var(--teal)}
.pill.ok{background:#d3f1da;color:#1b6b2e}.pill.wip{background:#fff1cf;color:#8a5a00}
@media (prefers-color-scheme:dark){.pill.ok{background:#1c4a2a;color:#9be3ae}.pill.wip{background:#4a3a14;color:#ffd98a}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-block:10px}
.card h3{font-size:1.05rem;margin-bottom:4px}
.goal{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;margin-block:6px}
.goal .n{background:var(--teal);color:var(--teal-ink);border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.goal span.t{flex:1;font-weight:700;font-size:.92rem}
details.acc{background:var(--surface);border:2px solid var(--line);border-radius:16px;margin-block:8px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:10px 14px;font:800 1rem var(--f-display);display:flex;gap:8px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"⌄";margin-inline-start:auto;color:var(--teal);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc[open]>summary{background:var(--soft)}
details.acc>.in{padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:3px 10px;font-weight:800;font-size:.9rem}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}.empty .big{font-size:3rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.8rem;color:var(--mute)}
.stdline{font-size:.78rem;color:var(--mute)}
/* ---------- lesson player ---------- */
.lesson{padding-bottom:70px}
.lbar{position:sticky;top:50px;z-index:15;background:var(--bg);padding-block:6px;border-bottom:2px solid var(--line)}
.lbar .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font:800 1.35rem/1 var(--f-display);font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 10px;min-width:74px;text-align:center}
.timer.low{border-color:var(--orange);color:var(--orange)}
.stars{font-weight:800;color:var(--help)}
.steps{display:flex;gap:4px;margin-top:6px;overflow:hidden}
.steps button{flex:1;border:0;height:8px;border-radius:99px;background:var(--line);padding:0}
.steps button.on{background:var(--teal)}.steps button.cur{background:var(--orange);height:10px;margin-top:-1px}
.segt{font:800 1.05rem var(--f-display);margin-block:8px 2px}
.stage{background:var(--surface);border:3px solid var(--teal);border-radius:22px;padding:14px;margin-block:8px;min-height:300px;min-width:0;position:relative}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--line)}
.dot.ok{background:var(--good);border-color:var(--good)}.dot.help{background:var(--help);border-color:var(--help)}.dot.no{background:#e03131;border-color:#e03131}.dot.cur{border-color:var(--orange)}
.qbox{text-align:center;font:800 1.35rem/1.6 var(--f-display);padding:10px 4px 14px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qbox .em{font-size:2.1rem;letter-spacing:2px;line-height:1.3}
.qbox .eq{font-size:2.6rem;direction:ltr;unicode-bidi:isolate}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:18px;min-height:76px;font:800 2.2rem var(--f-display);transition:transform .12s,border-color .2s;padding:6px}
.opt.w{font-size:1.25rem}
.opt:hover{border-color:var(--teal)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--surface));transform:scale(1.04)}
.opt.soft{opacity:.4;pointer-events:none}
.opt.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--yellow) 70%,transparent);border-color:var(--yellow)}}
.fb{min-height:34px;text-align:center;font-weight:800;margin-top:8px;color:var(--teal)}
.fb.p{color:var(--good);font-size:1.15rem}
.say{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:18px;padding:8px 12px;margin-block:6px}
.say .mc{width:56px;flex:none}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:10px}
.rules div{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-weight:800;font-size:.85rem}
.rules i{display:block;font-style:normal;font-size:2rem}
.goalbig{font:800 1.2rem/1.7 var(--f-display);text-align:center;background:color-mix(in srgb,var(--yellow) 25%,var(--surface));border-radius:16px;padding:10px;margin-block:8px}
.cv{display:block;margin:6px auto;background:var(--bg);border:3px dashed var(--line);border-radius:18px;touch-action:none;width:min(300px,100%);height:auto;aspect-ratio:1}
.mv{text-align:center}.mv .em{font-size:4rem;line-height:1.2}.mv h2{font-size:1.25rem;margin:4px}
.sky{position:relative;height:340px;overflow:hidden;border-radius:16px;background:linear-gradient(#cfeeff,#f4fbff)}
@media (prefers-color-scheme:dark){.sky{background:linear-gradient(#17394a,#0f2731)}}
.balloon{position:absolute;bottom:-90px;width:68px;height:82px;border-radius:50% 50% 48% 48%;border:0;font:800 2rem var(--f-display);color:#1b1b1b;animation:fl var(--d,8s) linear forwards;box-shadow:inset -7px -7px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;bottom:-20px;width:2px;height:20px;background:var(--mute)}
@keyframes fl{to{transform:translateY(-440px)}}
.balloon.pop{animation:none!important;transition:all .25s;transform:scale(1.5);opacity:0}
.balloon.wob{animation:none!important;transform:rotate(14deg)}
.sum{display:grid;gap:8px;text-align:center}
.mastery{font:800 1.3rem var(--f-display);padding:10px;border-radius:16px;background:var(--soft)}
.mastery.ok{background:#d3f1da;color:#1b6b2e}.mastery.help{background:#fff1cf;color:#8a5a00}.mastery.no{background:#ffe0e0;color:#a61e1e}
.lnav{position:fixed;inset-inline:0;bottom:0;z-index:25;background:var(--bg);border-top:2px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.lnav .wrap{display:flex;gap:8px;align-items:center}
.lnav .btn{flex:1}
.panel{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);border-top:3px solid var(--teal);border-radius:20px 20px 0 0;max-height:78vh;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.prow{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px dashed var(--line);padding-block:6px;font-weight:700;font-size:.88rem}
.prow .dots .dot{width:20px;height:20px;cursor:pointer}
textarea.fld,select.fld,input.fld{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;width:100%}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,25,27,.6);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.sheet{background:var(--surface);border:3px solid var(--teal);border-radius:22px;width:min(520px,100%);padding:14px;margin-block:auto}
.sheet h2{font-size:1.2rem;margin-bottom:6px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:7px;border-bottom:1px dashed var(--line);font-weight:700}
.set input[type=range]{width:46%}
.toast{position:fixed;inset-inline:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 28px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px;font-weight:800;z-index:80;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.mc svg,.mascot svg{display:block;width:100%;height:auto}
.mascot{position:fixed;inset-inline-start:8px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:54px;z-index:22;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.mascot.jump{animation:jump .6s}
@keyframes jump{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wv{transform-origin:80px 80px;animation:wv 2s ease-in-out infinite}
@keyframes wv{50%{transform:rotate(-14deg)}}
html.calm *{animation-duration:0s!important}
html.calm .opt.glow,html.calm .mascot.jump{animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- printable documents ---------- */
.doc{background:#fff;color:#111;border-radius:12px;padding:16px;font-family:Tahoma,"Tajawal",sans-serif;line-height:1.8;font-size:13px}
.doc h2{font-size:18px;text-align:center;margin:4px 0 8px}
.doc .by{font-size:9px;color:#666;text-align:start}
.doc .std{border:1.5px solid #333;border-radius:6px;padding:6px 10px;margin-block:8px;font-weight:700}
.doc table{width:100%;border-collapse:collapse;margin-block:8px}
.doc td,.doc th{border:1.5px solid #333;padding:5px 8px;text-align:start;vertical-align:top}
.doc th{background:#e8f4f2;width:30%}
.doc .sec{font-weight:800;margin-top:12px;border-bottom:2px solid #0e8f8a;display:inline-block}
.doc .sym{display:inline-block;min-width:46px;text-align:center;font-size:24px;border:1.5px solid #bbb;border-radius:8px;margin:2px 3px;padding:0 4px;direction:ltr}
.doc .sym.a{border-color:#2f9e44;background:#d3f1da;font-weight:800}
.doc .ok{color:#2f9e44;font-weight:800}
.doc .tr svg{width:70px;height:70px;margin:2px}
.doc .cert{border:6px double #0e8f8a;border-radius:14px;padding:22px;text-align:center;line-height:2.3}
.doc .cert .big{font-size:40px}.doc .cert h2{font-size:28px;color:#0e8f8a}
.dots-in{letter-spacing:2px}
@media print{
 body *{visibility:hidden}
 #docbody,#docbody *{visibility:visible}
 #docm{position:static;background:none;padding:0;overflow:visible}
 #docm .sheet{border:0;width:100%;padding:0}
 #docbody{position:absolute;inset-inline:0;top:0;padding:0}
 .doc{border-radius:0;padding:10px}
 .dochead,.top,.lnav,.mascot,#cf,.toast{display:none!important}
}
</style></head>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hd=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SPEC="الأخصائي / عماد عبد العزيز";
/* ---------- storage / prefs ---------- */
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(k in mem?mem[k]:d)}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const prefs=Object.assign({snd:true,mus:true,musv:60,voxv:90,big:false,calm:false},store.get("itqan_sp",{}));
const savePrefs=()=>store.set("itqan_sp",prefs);
function applyPrefs(){document.documentElement.classList.toggle("big",prefs.big);document.documentElement.classList.toggle("calm",prefs.calm);
 $("#s-snd").textContent=prefs.snd?"🔊":"🔇";$("#s-mus").textContent=prefs.mus?"🎵":"🔕";$("#s-big").textContent=prefs.big?"✅":"⬜";$("#s-calm").textContent=prefs.calm?"✅":"⬜";
 $("#r-mus").value=prefs.musv;$("#v-mus").textContent=hd(prefs.musv)+"%";$("#r-vox").value=prefs.voxv;$("#v-vox").textContent=hd(prefs.voxv)+"%";musicLevel()}
/* ---------- sound: effects, voice clips, soft music ---------- */
let actx=null,vox=null,lastSay=0;

function tone(f,t,d,v,type){const c=ac();if(!c||!prefs.snd)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=type||"sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d+.05)}
const sfx={pop(){tone(560,0,.1,.07);tone(840,.04,.1,.05)},ok(){tone(660,0,.12,.08);tone(880,.09,.12,.08);tone(1175,.19,.22,.07)},soft(){tone(330,0,.18,.04)},chime(){tone(880,0,.5,.06);tone(1320,.15,.6,.05)}};
function say(name,force){if(!prefs.snd||!window.ITQAN_AUDIO||!ITQAN_AUDIO[name])return false;const now=Date.now();if(!force&&now-lastSay<1800)return false;lastSay=now;
 try{if(vox)vox.pause();vox=new Audio(ITQAN_AUDIO[name]);vox.volume=Math.min(1,prefs.voxv/100);duck(true);const end=()=>duck(false);vox.onended=end;vox.onerror=end;const p=vox.play();if(p&&p.catch)p.catch(end);return true}catch(e){return false}}
/* soft ambient music: sparse pentatonic bells + warm pad, quiet and slow */
let mus=null,musTimer=null;
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33];
function musicOn(){if(mus||!prefs.mus||!prefs.snd)return;const c=ac();if(!c)return;
 const master=c.createGain();master.gain.value=.0001;
 const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1800;
 const dl=c.createDelay(1);dl.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.34;dl.connect(fb);fb.connect(dl);
 const wet=c.createGain();wet.gain.value=.5;lp.connect(master);lp.connect(dl);dl.connect(wet);wet.connect(master);master.connect(c.destination);
 const pad=[130.81,196,261.63].map((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.018-i*.004;o.connect(g);g.connect(lp);o.start();return o});
 mus={c,master,lp,pad};musicLevel();
 const bell=()=>{if(!mus)return;const f=pick(PENTA)*(Math.random()<.25?.5:1),o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type="sine";o2.type="triangle";o.frequency.value=f;o2.frequency.value=f*2.002;
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.11,n+.04);g.gain.exponentialRampToValueAtTime(.0001,n+3.4);const g2=c.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);o.start(n);o2.start(n);o.stop(n+3.5);o2.stop(n+3.5)};
 bell();musTimer=setInterval(()=>{if(Math.random()<.8)bell()},2200)}
function musicLevel(){if(!mus)return;const on=prefs.mus&&prefs.snd;mus.master.gain.setTargetAtTime(on?Math.max(.0001,prefs.musv/100*.9)*(ducked?.3:1):.0001,mus.c.currentTime,.5)}
let ducked=false;function duck(on){ducked=on;musicLevel()}
function musicOff(){if(!mus)return;const m=mus;mus=null;clearInterval(musTimer);try{m.master.gain.setTargetAtTime(.0001,m.c.currentTime,.2);setTimeout(()=>m.pad.forEach(o=>{try{o.stop()}catch(e){}}),800)}catch(e){}}

 const p=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*160,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,c:pick(cols)}));let f=0;
 (function step(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.15;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++f<130)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})()}

 const p=parts(),app=$("#app");window.scrollTo(0,0);
 if(!p.length)return app.innerHTML=viewHome();
 const m=/^g([1-6])$/.exec(p[0]);if(!m)return app.innerHTML=viewHome();const g=+m[1];

 if(p[1]!=="enr")return app.innerHTML=viewGrade(g);

/* ---- A4: tracing ---- */
function traceActivity(el){const N=5;L.res.a4=L.res.a4||Array(N).fill(null);let i=0;
 const guide=[[[.5,.15],[.5,.85]],[[.15,.5],[.85,.5]]];

 const show=()=>{let fails=0;
  el.innerHTML=`<div class="qhead"><span class="chip">المحاولة ${hd(i+1)} من ${hd(N)}</span><div class="dots">${L.res.a4.map((r,k)=>`<span class="dot ${r||""} ${k===i?"cur":""}"></span>`).join("")}</div></div><div class="qbox" style="min-height:0;padding-bottom:0">ارسم علامة الجمع بإصبعك فوق الخطوط</div><canvas class="cv" id="cv" width="300" height="300"></canvas><div class="fb" id="fb"></div><div class="row" style="justify-content:center"><button class="btn g sm" id="clr">🧽 مسح</button><button class="btn g sm" id="chk">✔ تحقق</button><span class="hint">للمعلم:</span><button class="btn sm" id="tOk">✔ أتقن</button><button class="btn g sm" id="tHelp">🟡 بمساعدة</button></div>`;
  const cv=$("#cv"),x=cv.getContext("2d");let drawing=false,ink=[];
  const base=(demo)=>{x.clearRect(0,0,300,300);x.lineCap="round";x.setLineDash([10,10]);x.strokeStyle="#9ab8b6";x.lineWidth=14;guide.forEach(([a,b])=>{x.beginPath();x.moveTo(a[0]*300,a[1]*300);x.lineTo(b[0]*300,b[1]*300);x.stroke()});x.setLineDash([]);x.fillStyle="#0e8f8a";x.font="800 22px Tajawal";x.fillText("١",138,26);x.fillText("٢",270,156)};
  const redraw=()=>{base();x.strokeStyle="#ff7a2f";x.lineWidth=12;ink.forEach(s=>{x.beginPath();s.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()})};
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);ink.push([pos(e)]);redraw()};cv.onpointermove=e=>{if(!drawing)return;ink[ink.length-1].push(pos(e));redraw()};cv.onpointerup=()=>{drawing=false};

   setTimeout(()=>{i++;if(i<N)show();else nextBar(el)},1300)};
  $("#clr").onclick=()=>{ink=[];redraw()};
  $("#chk").onclick=()=>{const all=ink.flat();if(all.length<10){$("#fb").textContent="ارسم أولاً بإصبعك ✋";return}
   const cover=pts.filter(p=>all.some(q=>Math.hypot(q[0]-p[0]*300,q[1]-p[1]*300)<26)).length/pts.length;
   const stray=all.filter(q=>!pts.some(p=>Math.hypot(q[0]-p[0]*300,q[1]-p[1]*300)<44)).length/all.length;
   if(cover>=.7&&stray<.35)finish(fails===0?"ok":"help");else{fails++;sfx.soft();if(fails>=3){finish("no");return}$("#fb").className="fb";$("#fb").textContent=fails===1?"قريب! ابدأ من الأعلى للأسفل ثم من اليمين لليسار 👀":"سأريك الطريق ✨";if(fails===2)demo()}};

 trials($("#fin"),{id:"fin",n:5,make:i=>({stem:i%2?`<div>اختر علامة الجمع</div><div class="em" style="direction:ltr;font-size:2.4rem">٢ ☐ ٣ = ٥</div>`:`<div>أين علامة الجمع؟</div>`,opts:bank[i].map(h=>({h,ok:h==="+"}))}),done:()=>summary(el)})}
function summary(el){const m=L.override||masteryOf();confetti();say("win",true);
 el.innerHTML=`<div class="sum"><div class="em" style="font-size:3.4rem">🏅</div><h2>انتهت الحصة، أحسنت!</h2><div class="mastery ${m}">النتيجة المقترحة: ${MTXT[m]}</div><p class="hint">يمكن للمعلم تعديل التقدير من لوحة التقييم 📋 قبل الطباعة.</p><div class="row" style="justify-content:center"><button class="btn" data-doc="assess:${L.goal.id}">🧾 ورقة التقييم</button><button class="btn o" data-doc="cert:${L.goal.id}">🏅 شهادة التشجيع</button><button class="btn g" data-doc="ws:${L.goal.id}">📝 ورقة عمل</button><button class="btn g" data-doc="hw:${L.goal.id}">🏠 واجب</button></div></div>`}
/* ---- teacher assessment panel ---- */
const AN={rev:"مراجعة",a1:"١ اكتشف العلامة",a2:"٢ العلامة الناقصة",a3:"٣ كلمات الجمع",a4:"٤ ارسم العلامة",fin:"الاختبار الختامي"};
const CYC=[null,"ok","help","no"];
function togglePanel(){const h=$("#panelHost");if(h.innerHTML){h.innerHTML="";return}drawPanel()}
function drawPanel(){const h=$("#panelHost");if(!h.innerHTML&&!L)return;const rows=["a1","a2","a3","a4","fin"].map(k=>{const r=L.res[k]||Array(5).fill(null);return `<div class="prow"><span>${AN[k]}</span><div class="dots">${r.map((v,i)=>`<span class="dot ${v||""}" data-k="${k}" data-i="${i}" role="button" tabindex="0" aria-label="تعديل المحاولة"></span>`).join("")}</div></div>`}).join("");
 const m=L.override||masteryOf();h.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><b>📋 لوحة التقييم</b><button class="btn g sm" id="pcl">✕ إغلاق</button></div><p class="hint">اضغط على أي نقطة لتغيير حالتها: 🟢 مستقل · 🟠 بمساعدة · 🔴 لم يتقن.</p>${rows}<div class="mastery ${m}" style="margin-block:8px;font-size:1.05rem">التقدير: ${MTXT[m]} (٤ من ٥ في الاختبار الختامي)</div><label class="hint">تعديل التقدير يدوياً<select class="fld" id="ovr"><option value="">حسب النتيجة</option><option value="ok">أتقن</option><option value="help">أتقن بمساعدة</option><option value="no">لم يتقن</option></select></label><label class="hint">ملاحظات<textarea class="fld" id="pn" rows="2" placeholder="مستوى المساعدة، ملاحظات السلوك... (بدون اسم الطالب)">${esc(L.note)}</textarea></label><div class="row" style="margin-top:8px"><button class="btn" data-doc="assess:${L.goal.id}">🧾 ورقة التقييم</button></div></div>`;
 $("#pcl").onclick=()=>{h.innerHTML=""};$("#ovr").value=L.override||"";$("#ovr").onchange=e=>{L.override=e.target.value||null;drawPanel()};$("#pn").oninput=e=>{L.note=e.target.value};
 $$("#panelHost .dot").forEach(d=>d.onclick=()=>{const k=d.dataset.k,i=+d.dataset.i;L.res[k]=L.res[k]||Array(5).fill(null);L.res[k][i]=CYC[(CYC.indexOf(L.res[k][i])+1)%4];drawPanel()})}
function refreshPanel(){if($("#panelHost").innerHTML)drawPanel()}
/* ================= printable documents ================= */
const SYM_ROWS=[["−","+","×","÷"],["÷","×","+","−"],["+","−","÷","×"],["×","÷","−","+"],["−","×","+","÷"]];
const EQS=[["٢","٣","٥"],["١","٤","٥"],["٣","٣","٦"],["٤","٢","٦"]];
const PWORDS=[["زائد",1],["ناقص",0],["أضف",1],["اطرح",0],["يجمع",1],["ينقص",0]];
const idline=`<div class="stdline">اسم الطالب: ................................... &nbsp; الصف: .............. &nbsp; التاريخ: ..............</div>`;
const docHead=(t,sub)=>`<div class="by">${SPEC}</div><h2>${t}</h2>${sub?`<div class="hint" style="text-align:center">${sub}</div>`:""}${idline}`;
function plusSvg(fill){return `<svg viewBox="0 0 70 70"><path d="M35 8V62M8 35H62" stroke="${fill?"#0e8f8a":"#aaa"}" stroke-width="${fill?10:9}" stroke-linecap="round" ${fill?"":'stroke-dasharray="3 9"'} fill="none"/></svg>`}
function docHtml(kind,id){const x=GOALS[id];const stg=`<div class="std"><b>الهدف قصير المدى:</b> ${esc(x.stg)}<br><b>الهدف التدريسي:</b> ${esc(x.t)}</div>`;
 if(kind==="assess"){const keys=["a1","a2","a3","a4","fin"];const rr=keys.map(k=>{const r=(L&&L.res[k])||[];return `<tr><td>${AN[k]}</td>${[0,1,2,3,4].map(i=>`<td style="text-align:center">${r[i]==="ok"?"✔":r[i]==="help"?"✔م":r[i]==="no"?"✖":"☐"}</td>`).join("")}</tr>`}).join("");
  const m=L&&(L.override||masteryOf());const mk=v=>(m===v?"☒":"☐");
  return `<div class="doc">${docHead("ورقة تقييم الهدف")}${stg}<table><tr><th>معيار الإتقان</th><td>٤ محاولات صحيحة من أصل ٥</td></tr><tr><th>مستوى المساعدة</th><td>☐ مستقل &nbsp; ☐ تلميح لفظي &nbsp; ☐ تلميح إيمائي &nbsp; ☐ مساعدة جسدية</td></tr><tr><th>التقدير</th><td>${mk("ok")} أتقن &nbsp; ${mk("help")} أتقن بمساعدة &nbsp; ${mk("no")} لم يتقن</td></tr></table><div class="sec">المحاولات</div><table><tr><th>النشاط</th><th>١</th><th>٢</th><th>٣</th><th>٤</th><th>٥</th></tr>${rr}</table><p class="hint" style="color:#555">✔ مستقل · ✔م بمساعدة · ✖ لم يتقن · ☐ لم يُسجّل</p><table><tr><th>ملاحظات</th><td style="height:80px">${L?esc(L.note):""}</td></tr><tr><th>التوقيع</th><td>الأخصائي / عماد عبد العزيز</td></tr></table></div>`}
 if(kind==="cert")return `<div class="doc"><div class="by">${SPEC}</div><div class="cert"><div class="big">🏅</div><h2>شهادة تشجيع</h2><p>تُمنح هذه الشهادة للطالب / الطالبة: ..................................</p><p>تقديراً لجهده وتميّزه في تحقيق هدف:<br><b>${esc(x.t)}</b></p><p>بتاريخ: ..................</p><p style="margin-top:10px">⭐ ⭐ ⭐ ⭐ ⭐<br>${SPEC}</p></div></div>`;
 const sol=kind==="wsol";
 const c1=SYM_ROWS.map(r=>`<div>${r.map(s=>`<span class="sym ${sol&&s==="+"?"a":""}">${s}</span>`).join("")}</div>`).join("");
 const c2=PWORDS.map(([w,p])=>`<div>☐${sol&&p?'<span class="ok">✔</span>':""} ${w}</div>`).join("");
 const c3=EQS.map(([a,b,c])=>`<div style="direction:ltr;text-align:right;font-size:22px">${a} <span class="sym ${sol?"a":""}" style="min-width:40px">${sol?"+":"&nbsp;"}</span> ${b} = ${c}</div>`).join("");
 const c4=`<div class="tr">${[0,1,2,3,4].map(()=>plusSvg(sol)).join("")}</div>`;
 if(kind==="ws"||kind==="wsol")return `<div class="doc">${docHead(sol?"ورقة عمل: علامة الجمع (نموذج الإجابة)":"ورقة عمل: علامة الجمع")}${stg}<div class="sec">١) ضع دائرة حول علامة الجمع في كل صف</div>${c1}<div class="sec">٢) ضع ✔ أمام الكلمة التي تدل على علامة الجمع</div>${c2}<div class="sec">٣) اكتب علامة الجمع في المكان المناسب</div>${c3}<div class="sec">٤) ارسم علامة الجمع فوق الخطوط</div>${c4}</div>`;
 if(kind==="hw")return `<div class="doc">${docHead("واجب منزلي: علامة الجمع","بمساعدة ولي الأمر عند الحاجة، ٥ دقائق فقط")}${stg}<div class="sec">١) ضع دائرة حول علامة الجمع</div>${SYM_ROWS.slice(0,3).map(r=>`<div>${r.map(s=>`<span class="sym">${s}</span>`).join("")}</div>`).join("")}<div class="sec">٢) اكتب علامة الجمع ٥ مرات</div><div style="font-size:28px;letter-spacing:10px;color:#bbb;direction:ltr">+ + + + +</div><div style="height:50px;border-bottom:1.5px dotted #888;margin-bottom:6px"></div><div class="sec">٣) أكمل بعلامة الجمع</div>${EQS.slice(0,2).map(([a,b,c])=>`<div style="direction:ltr;text-align:right;font-size:22px">${a} ☐ ${b} = ${c}</div>`).join("")}<p class="hint" style="margin-top:12px">ملاحظة لولي الأمر: شجّع ابنك على قول «علامة الجمع» بصوت واضح، وامدح محاولته.</p></div>`;
 return ""}

/* ================= PowerPoint ================= */
function loadPptx(){return new Promise((res,rej)=>{if(window.PptxGenJS)return res();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
function buildDeck(P){const p=new P();p.rtlMode=true;p.layout="LAYOUT_WIDE";p.author=SPEC;p.title="علامة الجمع - إتقان";
 const F="Arial",W=13.33,H=7.5,C={t:"0E8F8A",o:"FF7A2F",y:"FFC933",bg:"F1FAF8",ink:"0F2B2E"};
 const slide=(title,o={})=>{const s=p.addSlide();s.background={color:o.bg||C.bg};s.addShape(p.ShapeType.rect,{x:0,y:0,w:W,h:.9,fill:{color:C.t}});s.addText(title,{x:.4,y:.1,w:W-.8,h:.7,fontFace:F,fontSize:26,bold:true,color:"FFFFFF",align:"right",rtlMode:true,valign:"middle"});
  s.addText(SPEC,{x:.3,y:H-.4,w:4,h:.3,fontFace:F,fontSize:9,color:"6B7F80",align:"left",rtlMode:true});return s};
 const big=(s,t,o={})=>s.addText(t,Object.assign({x:.8,y:1.5,w:W-1.6,h:4.6,fontFace:F,fontSize:60,bold:true,color:C.ink,align:"center",valign:"middle",rtlMode:true},o));
 const symOf=n=>["+","−","×","÷"].slice(0,n);
 let s=p.addSlide();s.background={color:C.t};s.addText("علامة الجمع ➕",{x:.5,y:2,w:W-1,h:1.6,fontFace:F,fontSize:60,bold:true,color:"FFFFFF",align:"center",rtlMode:true});
 s.addText("الأهداف الإثرائية · الصف الرابع الابتدائي · حصة تفاعلية ٤٠ دقيقة",{x:.5,y:3.8,w:W-1,h:.8,fontFace:F,fontSize:22,color:"FFFFFF",align:"center",rtlMode:true});
 s.addText(SPEC,{x:.3,y:H-.4,w:4,h:.3,fontFace:F,fontSize:9,color:"D6F1EE",align:"left",rtlMode:true});
 s=slide("🎯 هدفنا اليوم");big(s,"أن أتعرّف على علامة الجمع  +",{fontSize:48});
 s=slide("📏 قواعدنا");big(s,"👂 أسمع جيداً\n🙋 أرفع يدي\n🤝 أساعد زميلي",{fontSize:44});
 s=slide("🔁 مراجعة (٣ د)");big(s,"نعدّ معاً:  🍎🍎🍎🍎\nكم عدد التفاحات؟",{fontSize:40});s=slide("✅ إجابة المراجعة");big(s,"٤ تفاحات 🍎",{fontSize:54});
 s=slide("➕ هذه علامة الجمع");big(s,"+",{fontSize:150,color:C.o});
 const qa=(title,items)=>{items.forEach(([q,a],i)=>{let s1=slide(`${title} · سؤال ${i+1}`);big(s1,q,{fontSize:44});let s2=slide(`${title} · الإجابة ${i+1}`,{bg:"FFF8E1"});big(s2,a,{fontSize:54,color:"1B6B2E"})})};
 qa("النشاط ١: اكتشف العلامة",[["أين علامة الجمع؟\n+   −   ×   ÷","+  ✅"],["أين علامة الجمع؟\n×   +   ÷   −","+  ✅ (الثانية)"],["أين علامة الجمع؟\n−   ÷   ×   +","+  ✅ (الأخيرة)"]]);
 qa("النشاط ٢: العلامة الناقصة",[["🍎🍎 ؟ 🍎 = 🍎🍎🍎\nما العلامة الناقصة؟","+  لأننا نجمع"],["🐟 ؟ 🐟🐟🐟 = 🐟🐟🐟🐟","+  لأننا نجمع"],["اختر المسألة التي فيها علامة الجمع:\n٣ − ١      ٢ + ١      ٢ × ١","٢ + ١"]]);
 qa("النشاط ٣: كلمات الجمع",[["أي كلمة تدل على الجمع؟\nزائد · ناقص · يأخذ","زائد"],["أي كلمة تدل على الجمع؟\nاطرح · أضف · ينقص","أضف"],["أي كلمة تدل على الجمع؟\nيجمع · نُنقص · ناقص","يجمع"]]);
 s=slide("✍️ النشاط ٤: ارسم العلامة");big(s,"خط عمودي ↓ ثم خط أفقي ←\nارسم علامة الجمع في الهواء ثم على الورقة",{fontSize:38});
 s=slide("🤸 استراحة حركة (٣ د)");big(s,"🤞 كوّن علامة + بإصبعيك\n🙆 ارفع يديك واخفضهما ٥ مرات\n🌬️ شهيق ٤ وزفير ٤",{fontSize:34});
 s=slide("🎈 لعبة المكافأة (٦ د)");big(s,"أشر إلى علامة الجمع فقط\n+  ×  −  ÷  +  ÷  −  +",{fontSize:44});s=slide("✅ إجابة اللعبة",{bg:"FFF8E1"});big(s,"علامات الجمع هي الأولى والخامسة والثامنة",{fontSize:40,color:"1B6B2E"});
 s=slide("🏅 ختام وتقييم (٣ د)");big(s,"ما اسم هذه العلامة؟   +\nأين نستخدمها؟ عندما نريد أن نجمع",{fontSize:38});
 s=slide("🌟 شكراً لك!");big(s,"أحسنت يا بطل ⭐⭐⭐⭐⭐",{fontSize:54});return p}
